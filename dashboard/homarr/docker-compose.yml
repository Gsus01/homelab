#---------------------------------------------------------------------#
#     Homarr - A simple, yet powerful dashboard for your server.      #
#---------------------------------------------------------------------#
services:
  homarr:
    container_name: homarr
    image: ghcr.io/homarr-labs/homarr:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Optional, only if you want docker integration
      - ./homarr/appdata:/appdata
    environment:
      - SECRET_ENCRYPTION_KEY=ff6dcf939359c161aca29338482661e067a8177835ad3353869370629d1ad26e
        # ports:
        # - '7575:7575'
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"
      traefik.http.routers.homarr.entrypoints: "web, websecure"
      traefik.http.routers.homarr.rule: "Host(`homarr.jpabreu.com`)"
      traefik.http.routers.homarr.tls: "true"
      traefik.http.routers.homarr.tls.certresolver: "cloudflare"
      traefik.http.services.homarr.loadbalancer.server.port: "7575"
networks:
  traefik:
    external: true
