services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - traefik
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8080
    volumes:
      - ./config:/config
      - /mnt/raid1/download:/downloads
    ports:
      - 6881:6881
      - 6881:6881/udp
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"

      # Router para la Web UI de qBittorrent
      traefik.http.routers.qbittorrent.entrypoints: "web, websecure"
      traefik.http.routers.qbittorrent.rule: "Host(`qbittorrent.jpabreu.com`)"
      traefik.http.routers.qbittorrent.tls: "true"
      traefik.http.routers.qbittorrent.tls.certresolver: "cloudflare"

      # Servicio que apunta al puerto de la Web UI
      traefik.http.services.qbittorrent.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
