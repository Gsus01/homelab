services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    user: 1000:1000
    networks:
      - traefik
    volumes:
      - ./config:/app/config
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
    labels:
      traefik.enable: "true"
      traefik.docker.network: "traefik"

      # Router para Jellyseerr (escucha en http y https)
      traefik.http.routers.jellyseerr.entrypoints: "web, websecure"
      traefik.http.routers.jellyseerr.rule: "Host(`jellyseerr.jpabreu.com`)"
      traefik.http.routers.jellyseerr.tls: "true"
      traefik.http.routers.jellyseerr.tls.certresolver: "cloudflare"

      # Servicio de Jellyseerr
      traefik.http.services.jellyseerr.loadbalancer.server.port: "5055"
    
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

networks:
  traefik:
    external: true
