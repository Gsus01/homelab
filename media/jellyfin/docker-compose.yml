services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    user: 1000:1000
    deploy:
      resources:
        reservations:
          memory: 4gb
    networks:
      - traefik
    ports:
      - 1900:1900/udp
      - 7359:7359/udp
      # - 8096:8096/tcp
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /mnt/raid1/media:/media

    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.jpabreu.com

    labels:

      traefik.enable: "true"
      traefik.docker.network: "traefik"

      traefik.http.routers.jellyfin.entrypoints: "web, websecure"
      traefik.http.routers.jellyfin.rule: "Host(`jellyfin.jpabreu.com`)"
      traefik.http.routers.jellyfin.tls: "true"
      traefik.http.routers.jellyfin.tls.certresolver: "cloudflare"

      traefik.http.services.jellyfin.loadbalancer.server.port: "8096"

networks:
  traefik:
    external: true
